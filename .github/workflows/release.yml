name: GitHub release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions: {}

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout trusted release helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create GitHub release with filtered notes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TAG_SHA: ${{ github.event.after }}
        with:
          script: |
            const {publish} = require('./.github/scripts/github-release.cjs');
            await publish({github, context, core}, process.env.RELEASE_TAG,
              process.env.RELEASE_TAG_SHA);
